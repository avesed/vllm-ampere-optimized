name: watch-upstream

# Polls vllm-project/vllm for a new stable release once a day. When the latest tag differs from
# the committed UPSTREAM_VLLM_VERSION marker, open ONE reminder issue for that tag — deduped
# against all issues (open AND closed), so closing the reminder never re-triggers it. No patch
# replay, no CI build: migration to a new upstream is planned and built by hand.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-upstream
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get latest upstream stable vLLM tag
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # /releases/latest excludes prereleases/drafts -> stable tag only (e.g. v0.25.1).
          TAG=$(gh api repos/vllm-project/vllm/releases/latest --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream stable vLLM: $TAG"

      - name: Compare with vendored marker
        id: cmp
        run: |
          LAST=$(cat UPSTREAM_VLLM_VERSION 2>/dev/null | tr -d '[:space:]' || echo none)
          echo "vendored: '$LAST'  latest: '${{ steps.up.outputs.tag }}'"
          if [ "${{ steps.up.outputs.tag }}" != "$LAST" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open one reminder issue for the new tag (dedup incl. closed)
        if: steps.cmp.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          TITLE="upstream vLLM $TAG released"
          # --state all: once the reminder exists (even closed), never open it again for this tag.
          if [ -z "$(gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" \
              --body "Upstream vLLM \`$TAG\` is newer than the vendored \`$(cat UPSTREAM_VLLM_VERSION)\`. One-time reminder — close after reading; it will not re-open for this tag."
          else
            echo "Reminder for $TAG already exists (open or closed) — skipping."
          fi
